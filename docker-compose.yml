version: "3"
services:
  springboot-app:
    image: springboot-app
    restart: always
    build: .
    ports:
      - "9090:8082"
    environment:
      MYSQL_HOST: mysqldb
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_PORT: 3306
  mysqldb:
    container_name: mysqldb
    image: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: miola
      MYSQL_ROOT_PASSWORD: root
    # AJOUTE CES DEUX LIGNES POUR SAUVEGARDER LA DB :
    volumes:
      - db_data:/var/lib/mysql

# AJOUTE CE BLOC TOUT A LA FIN DU FICHIER :
volumes:
  db_data: